name: Build IGBZ Plugins on nopCommerce 4.90.6
on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: igbz }
      - uses: actions/checkout@v4
        with: { repository: nopSolutions/nopCommerce, ref: release-4.90.6, path: nopCommerce }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - shell: bash
        run: |
          cp -r igbz/Plugins/* nopCommerce/src/Plugins/
      - working-directory: nopCommerce
        shell: bash
        run: dotnet restore src/NopCommerce.sln --verbosity minimal
      - working-directory: nopCommerce
        shell: bash
        run: |
          dotnet build src/Plugins/Nop.Plugin.Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.csproj -c Release --no-restore -o src/Presentation/Nop.Web/Plugins/Misc.MultiTenantStores/
          dotnet build src/Plugins/Nop.Plugin.Api/Nop.Plugin.Api.csproj -c Release --no-restore -o src/Presentation/Nop.Web/Plugins/Api/
          dotnet build src/Plugins/Nop.Plugin.Misc.MasterSiteHub/Nop.Plugin.Misc.MasterSiteHub.csproj -c Release --no-restore -o src/Presentation/Nop.Web/Plugins/Misc.MasterSiteHub/
          dotnet build src/Plugins/Nop.Plugin.Misc.InstagramAssistant/Nop.Plugin.Misc.InstagramAssistant.csproj -c Release --no-restore -o src/Presentation/Nop.Web/Plugins/Misc.InstagramAssistant/
          ls -R src/Presentation/Nop.Web/Plugins | head -n 500
      - working-directory: nopCommerce
        shell: bash
        run: |
          for plugin in "Api:Api" "Misc.MultiTenantStores:Misc.MultiTenantStores" "Misc.MasterSiteHub:Misc.MasterSiteHub" "Misc.InstagramAssistant:Misc.InstagramAssistant"; do
            IFS=":" read -r srcName outName <<< "$plugin"
            cp -n "src/Plugins/Nop.Plugin.$srcName/plugin.json" "src/Presentation/Nop.Web/Plugins/$outName/" || true
            cp -r "src/Plugins/Nop.Plugin.$srcName/Views" "src/Presentation/Nop.Web/Plugins/$outName/" 2>/dev/null || true
          done
          test -f src/Presentation/Nop.Web/Plugins/Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.dll
          test -f src/Presentation/Nop.Web/Plugins/Api/Nop.Plugin.Api.dll
      - working-directory: nopCommerce
        shell: bash
        run: |
          mkdir -p ../artifacts
          cd src/Presentation/Nop.Web/Plugins
          7z a -tzip ../../../../../artifacts/Misc.MultiTenantStores.zip Misc.MultiTenantStores
          7z a -tzip ../../../../../artifacts/Api.zip Api
          7z a -tzip ../../../../../artifacts/Misc.MasterSiteHub.zip Misc.MasterSiteHub
          7z a -tzip ../../../../../artifacts/Misc.InstagramAssistant.zip Misc.InstagramAssistant
          7z a -tzip ../../../../../artifacts/IGBZ-All-Plugins.zip Misc.MultiTenantStores Misc.InstagramAssistant Misc.MasterSiteHub Api
      - uses: actions/upload-artifact@v4
        with: { name: igbz-plugins-4906, path: artifacts/*.zip }
