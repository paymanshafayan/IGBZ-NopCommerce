name: Build IGBZ Plugins on nopCommerce 4.90.6

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout IGBZ plugins (self)
        uses: actions/checkout@v4
        with:
          path: igbz
          fetch-depth: 1

      - name: Checkout nopCommerce 4.90.6 source
        uses: actions/checkout@v4
        with:
          repository: nopSolutions/nopCommerce
          ref: release-4.90.6
          path: nopCommerce
          fetch-depth: 1

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: false

      - name: Show dotnet info
        run: |
          dotnet --info
          dotnet nuget list source

      - name: Copy IGBZ plugins into nopCommerce src/Plugins
        shell: bash
        run: |
          ls -R igbz/Plugins | head -n 100
          cp -r igbz/Plugins/Nop.Plugin.Api nopCommerce/src/Plugins/
          cp -r igbz/Plugins/Nop.Plugin.Misc.MultiTenantStores nopCommerce/src/Plugins/
          cp -r igbz/Plugins/Nop.Plugin.Misc.InstagramAssistant nopCommerce/src/Plugins/
          cp -r igbz/Plugins/Nop.Plugin.Misc.MasterSiteHub nopCommerce/src/Plugins/
          ls -1 nopCommerce/src/Plugins | grep -iE "Api|MultiTenant|Instagram|MasterSite"

      - name: Add IGBZ plugins to NopCommerce.sln
        working-directory: nopCommerce
        shell: bash
        run: |
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.csproj --in-root || echo "already"
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Misc.InstagramAssistant/Nop.Plugin.Misc.InstagramAssistant.csproj --in-root || echo "already"
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Misc.MasterSiteHub/Nop.Plugin.Misc.MasterSiteHub.csproj --in-root || echo "already"
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Api/Nop.Plugin.Api.csproj --in-root || echo "already"
          dotnet sln src/NopCommerce.sln list | grep -iE "Api|MultiTenant|Instagram|MasterSite" || true

      - name: Restore (whole sln) with detailed log capture
        working-directory: nopCommerce
        shell: bash
        run: |
          set -o pipefail
          echo "=== Attempting restore whole sln ==="
          dotnet restore src/NopCommerce.sln --verbosity normal 2>&1 | tee ../restore-sln.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Restore exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FULL LOG (last 500 lines) ==="
            tail -n 500 ../restore-sln.log
            echo "=== Trying to restore only IGBZ plugins individually for diagnosis ==="
            echo "--- MultiTenantStores ---"
            dotnet restore src/Plugins/Nop.Plugin.Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.csproj --verbosity normal 2>&1 | tee ../restore-mts.log || true
            echo "--- Api ---"
            dotnet restore src/Plugins/Nop.Plugin.Api/Nop.Plugin.Api.csproj --verbosity normal 2>&1 | tee ../restore-api.log || true
            echo "--- MasterSiteHub ---"
            dotnet restore src/Plugins/Nop.Plugin.Misc.MasterSiteHub/Nop.Plugin.Misc.MasterSiteHub.csproj --verbosity normal 2>&1 | tee ../restore-msh.log || true
            echo "--- InstagramAssistant ---"
            dotnet restore src/Plugins/Nop.Plugin.Misc.InstagramAssistant/Nop.Plugin.Misc.InstagramAssistant.csproj --verbosity normal 2>&1 | tee ../restore-ig.log || true
            exit $EXIT_CODE
          fi

      - name: Build IGBZ plugins (core first)
        if: success()
        working-directory: nopCommerce
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/Plugins/Nop.Plugin.Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.csproj -c Release --no-restore --verbosity minimal 2>&1 | tee ../build-mts.log
          dotnet build src/Plugins/Nop.Plugin.Api/Nop.Plugin.Api.csproj -c Release --no-restore --verbosity minimal 2>&1 | tee ../build-api.log
          dotnet build src/Plugins/Nop.Plugin.Misc.MasterSiteHub/Nop.Plugin.Misc.MasterSiteHub.csproj -c Release --no-restore --verbosity minimal 2>&1 | tee ../build-msh.log
          dotnet build src/Plugins/Nop.Plugin.Misc.InstagramAssistant/Nop.Plugin.Misc.InstagramAssistant.csproj -c Release --no-restore --verbosity minimal 2>&1 | tee ../build-ig.log

      - name: Verify + Package
        if: success()
        working-directory: nopCommerce
        shell: bash
        run: |
          ls -R src/Presentation/Nop.Web/Plugins | head -n 400
          ls -lh src/Presentation/Nop.Web/Plugins/Misc.MultiTenantStores/
          ls -lh src/Presentation/Nop.Web/Plugins/Api/
          mkdir -p ../artifacts
          cd src/Presentation/Nop.Web/Plugins
          7z a -tzip ../../../../../artifacts/Misc.MultiTenantStores.zip Misc.MultiTenantStores
          7z a -tzip ../../../../../artifacts/Misc.InstagramAssistant.zip Misc.InstagramAssistant
          7z a -tzip ../../../../../artifacts/Misc.MasterSiteHub.zip Misc.MasterSiteHub
          7z a -tzip ../../../../../artifacts/Api.zip Api
          7z a -tzip ../../../../../artifacts/IGBZ-All-Plugins.zip Misc.MultiTenantStores Misc.InstagramAssistant Misc.MasterSiteHub Api
          ls -lh ../../../../../artifacts/

      - name: Upload plugin artifacts (on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: igbz-plugins-4906
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 15

      - name: Upload restore/build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-logs
          path: |
            restore-*.log
            build-*.log
          if-no-files-found: warn
          retention-days: 5
