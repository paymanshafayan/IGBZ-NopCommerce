name: Build IGBZ Plugins on nopCommerce 4.90.6

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # nopCommerce official CI uses windows-latest – more compatible for plugins
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout IGBZ plugins (self)
        uses: actions/checkout@v4
        with:
          path: igbz
          fetch-depth: 1

      - name: Checkout nopCommerce 4.90.6 source
        uses: actions/checkout@v4
        with:
          repository: nopSolutions/nopCommerce
          ref: release-4.90.6
          path: nopCommerce
          fetch-depth: 1

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: nopCommerce/src/**/*.csproj

      - name: Show dotnet info
        run: dotnet --info

      - name: Copy IGBZ plugins into nopCommerce src/Plugins
        shell: bash
        run: |
          echo "Listing IGBZ plugins:"
          ls -R igbz/Plugins
          echo "Copying to nopCommerce/src/Plugins ..."
          cp -r igbz/Plugins/Nop.Plugin.Api nopCommerce/src/Plugins/
          cp -r igbz/Plugins/Nop.Plugin.Misc.MultiTenantStores nopCommerce/src/Plugins/
          cp -r igbz/Plugins/Nop.Plugin.Misc.InstagramAssistant nopCommerce/src/Plugins/
          cp -r igbz/Plugins/Nop.Plugin.Misc.MasterSiteHub nopCommerce/src/Plugins/
          ls -1 nopCommerce/src/Plugins | grep -E "Api|MultiTenant|Instagram|MasterSite" || dir nopCommerce/src/Plugins | findstr /i "Api MultiTenant Instagram MasterSite"

      - name: Add IGBZ plugins to NopCommerce.sln
        working-directory: nopCommerce
        run: |
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.csproj --in-root || echo "already in sln"
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Misc.InstagramAssistant/Nop.Plugin.Misc.InstagramAssistant.csproj --in-root || echo "already in sln"
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Misc.MasterSiteHub/Nop.Plugin.Misc.MasterSiteHub.csproj --in-root || echo "already in sln"
          dotnet sln src/NopCommerce.sln add src/Plugins/Nop.Plugin.Api/Nop.Plugin.Api.csproj --in-root || echo "already in sln"
          dotnet sln src/NopCommerce.sln list | findstr /i "Api MultiTenant Instagram MasterSite"

      - name: Restore NuGet (verbose)
        working-directory: nopCommerce
        # on failure, also try detailed log and restore per-plugin for diagnostics
        run: |
          echo "=== dotnet nuget list source ==="
          dotnet nuget list source
          echo "=== Restore whole solution (normal) ==="
          dotnet restore src/NopCommerce.sln --verbosity minimal || (
            echo "=== Whole-sln restore failed, trying detailed ==="
            dotnet restore src/NopCommerce.sln --verbosity normal
            echo "=== Trying plugin-only restore for diagnostics ==="
            dotnet restore src/Plugins/Nop.Plugin.Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.csproj --verbosity normal || true
            exit 1
          )

      - name: Build IGBZ plugins (core first)
        working-directory: nopCommerce
        run: |
          echo "Building MultiTenantStores..."
          dotnet build src/Plugins/Nop.Plugin.Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.csproj -c Release --no-restore -v minimal
          echo "Building dependents..."
          dotnet build src/Plugins/Nop.Plugin.Api/Nop.Plugin.Api.csproj -c Release --no-restore -v minimal
          dotnet build src/Plugins/Nop.Plugin.Misc.MasterSiteHub/Nop.Plugin.Misc.MasterSiteHub.csproj -c Release --no-restore -v minimal
          dotnet build src/Plugins/Nop.Plugin.Misc.InstagramAssistant/Nop.Plugin.Misc.InstagramAssistant.csproj -c Release --no-restore -v minimal

      - name: Verify build outputs
        working-directory: nopCommerce
        shell: bash
        run: |
          echo "Checking output folders..."
          ls -R src/Presentation/Nop.Web/Plugins | head -n 300 || dir src/Presentation/Nop.Web/Plugins /s
          test -f src/Presentation/Nop.Web/Plugins/Misc.MultiTenantStores/Nop.Plugin.Misc.MultiTenantStores.dll || (echo "MultiTenantStores.dll not found" && ls src/Presentation/Nop.Web/Plugins/Misc.MultiTenantStores && exit 1)
          test -f src/Presentation/Nop.Web/Plugins/Api/Nop.Plugin.Api.dll || (echo "Api.dll not found" && exit 1)
          test -f src/Presentation/Nop.Web/Plugins/Misc.MasterSiteHub/Nop.Plugin.Misc.MasterSiteHub.dll || (echo "MasterSiteHub.dll not found" && exit 1)
          test -f src/Presentation/Nop.Web/Plugins/Misc.InstagramAssistant/Nop.Plugin.Misc.InstagramAssistant.dll || (echo "InstagramAssistant.dll not found" && exit 1)
          echo "All IGBZ plugins built successfully."

      - name: Package plugins as zip
        working-directory: nopCommerce
        shell: bash
        run: |
          mkdir -p ../artifacts
          cd src/Presentation/Nop.Web/Plugins
          7z a -tzip ../../../../../artifacts/Misc.MultiTenantStores.zip Misc.MultiTenantStores
          7z a -tzip ../../../../../artifacts/Misc.InstagramAssistant.zip Misc.InstagramAssistant
          7z a -tzip ../../../../../artifacts/Misc.MasterSiteHub.zip Misc.MasterSiteHub
          7z a -tzip ../../../../../artifacts/Api.zip Api
          7z a -tzip ../../../../../artifacts/IGBZ-All-Plugins.zip Misc.MultiTenantStores Misc.InstagramAssistant Misc.MasterSiteHub Api
          ls -lh ../../../../../artifacts/ || dir ../../../../../artifacts/

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: igbz-plugins-4906
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 15
